name: Build and validate

on:
  push:
    branches:
      - main
      - next
      - 'feature/*'
      - 'fix/*'
      - 'hotfix/*'
      - 'release/*'
  pull_request:

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      CI: true
    defaults:
      run:
        working-directory: blue-bex-java
    steps:
      - name: Check out BEX
        uses: actions/checkout@v4
        with:
          path: blue-bex-java
          fetch-depth: 0

      - name: Check out exact verified Blue Language
        uses: actions/checkout@v4
        with:
          repository: bluecontract/blue-language-java
          ref: 9a607e584ff5dd973684d35d71eb4022d946b760
          path: blue-language-java

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run clean local-composite working gate
        run: >-
          ./gradlew --no-daemon clean bexWorkingVerification
          -PblueLanguageCompositePath=../blue-language-java

      - name: Run modernization and serious benchmark gate
        run: >-
          ./gradlew --no-daemon bexModernizationVerification
          -PblueLanguageCompositePath=../blue-language-java

      - name: Archive reports and test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bex-evidence
          path: |
            blue-bex-java/**/build/reports/**
            blue-bex-java/**/build/test-results/**

      - name: Archive modular release artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bex-artifacts
          path: |
            blue-bex-java/blue-bex-core/build/libs/**
            blue-bex-java/blue-bex-contracts/build/libs/**
            blue-bex-java/blue-bex-java/build/libs/**
            blue-bex-java/build/distributions/**
