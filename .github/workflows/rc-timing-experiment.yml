name: BEX full RC verification timing (no publication)

on:
  push:
    branches: [codex/ci/bex-parallel-experiment]
    paths:
      - '.github/scripts/rc-timing-experiment.py'
      - '.github/scripts/test_rc_timing_experiment.py'
      - '.github/workflows/rc-timing-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: bex-full-rc-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    if: github.ref == 'refs/heads/codex/ci/bex-parallel-experiment'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: corretto
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind reproducible source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Full sequential RC verification
        run: python .github/scripts/rc-timing-experiment.py baseline
      - name: Preserve baseline measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bex-rc-result-baseline
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/bex-rc-output/
      - name: Preserve complete final reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bex-rc-reports-${{ github.job }}
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**
  independent:
    if: github.ref == 'refs/heads/codex/ci/bex-parallel-experiment'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: corretto
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind reproducible source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Full isolated clean build
        run: python .github/scripts/rc-timing-experiment.py independent '${{ matrix.index }}'
      - name: Transfer actual independent evidence
        uses: actions/upload-artifact@v4
        with:
          name: bex-rc-input-${{ matrix.index }}
          retention-days: 2
          if-no-files-found: error
          path: ${{ runner.temp }}/bex-rc-output/inputs.tar.gz
      - name: Preserve independent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bex-rc-log-${{ matrix.index }}
          retention-days: 7
          path: ${{ runner.temp }}/bex-rc-output/*.log
  parallel:
    if: github.ref == 'refs/heads/codex/ci/bex-parallel-experiment'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: independent
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: corretto
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind reproducible source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: bex-rc-input-*
          path: ${{ runner.temp }}/bex-rc-downloads
      - name: Compare real inputs and execute full final RC verification
        run: python .github/scripts/rc-timing-experiment.py parallel "$RUNNER_TEMP/bex-rc-downloads"
      - name: Preserve parallel measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bex-rc-result-parallel
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/bex-rc-output/
      - name: Preserve complete final reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bex-rc-reports-${{ github.job }}
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**
  summary:
    if: always() && github.ref == 'refs/heads/codex/ci/bex-parallel-experiment'
    needs: [baseline, independent, parallel]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: bex-rc-result-*
          path: ${{ runner.temp }}/bex-rc-results
      - name: Verify complete equivalence and compare wall time
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          INDEPENDENT_RESULT: ${{ needs.independent.result }}
          PARALLEL_RESULT: ${{ needs.parallel.result }}
        run: |
          test "$BASELINE_RESULT" = success
          test "$INDEPENDENT_RESULT" = success
          test "$PARALLEL_RESULT" = success
          python .github/scripts/rc-timing-experiment.py summary "$RUNNER_TEMP/bex-rc-results"
