name: Release

on:
  workflow_dispatch:

jobs:
  Release:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Check if branch is main
        run: |
          if [[ "${GITHUB_REF##*/}" != "main" ]]; then
            echo "This workflow can only be triggered for the main branch."
            exit 1
          fi

      - name: Set up Java 8 test runtime
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prove full BEX publication readiness
        run: bash .github/scripts/run-final-publication-gates.sh

      - name: Execute Gradle publish
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/blue-bex-publish-gradle-home
        run: ./gradlew publish

      - name: Execute Gradle release
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/blue-bex-jreleaser-gradle-home
          JRELEASER_GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: ./gradlew jreleaserFullRelease

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: |
            build/distributions
            blue-bex-core/build/libs
            blue-bex-contracts/build/libs
            blue-bex-java/build/libs
            blue-bex-core/build/publications
            blue-bex-contracts/build/publications
            blue-bex-java/build/publications
            build/reports
            **/build/reports
            **/build/test-results
            build/jreleaser
