name: Release RC

on:
  push:
    branches:
      - next
    paths:
      - '.github/scripts/**'
      - '.github/workflows/release-rc.yml'
      - '.github/workflows/release-verification.yml'
      - '.github/actions/release-setup/**'
      - '.cz.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build-logic/**'
      - 'blue-bex-core/**'
      - 'blue-bex-contracts/**'
      - 'blue-bex-conformance/**'
      - 'blue-bex-java/**'
      - 'examples/**'
      - 'docs/**'
      - 'specifications/**'
      - 'src/**'

permissions:
  contents: read
  actions: read
concurrency:
  group: >-
    ${{ startsWith(github.event.head_commit.message, 'chore: release ') && format('bex-release-rc-skip-{0}', github.run_id) || 'bex-release-rc' }}
  cancel-in-progress: false
jobs:
  ReleaseRC:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: release ') == false }}"
    uses: ./.github/workflows/release-verification.yml
    with:
      mode: rc
    secrets: inherit
