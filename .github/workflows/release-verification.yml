name: BEX shared release verification
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
    secrets:
      WORKFLOW_PAT:
        required: false
      MAVENCENTRAL_USERNAME:
        required: false
      MAVENCENTRAL_PASSWORD:
        required: false
      GPG_PASSPHRASE:
        required: false
      GPG_PUBLIC_KEY:
        required: false
      GPG_SECRET_KEY:
        required: false
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tree: ${{ steps.source.outputs.tree }}
      attempt: ${{ steps.source.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Prepare one source for all verification jobs
        id: source
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          python .github/scripts/release-ci.py "$RELEASE_MODE" prepare
      - uses: actions/upload-artifact@v4
        with:
          name: bex-release-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bex-release-source/
          retention-days: 2
          if-no-files-found: error
  independent:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - uses: actions/download-artifact@v4
        with:
          name: bex-release-source-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/bex-release-source
      - name: Independent clean build of prepared source
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          PREPARED_COMMIT: ${{ needs.prepare.outputs.commit }}
          PREPARED_TREE: ${{ needs.prepare.outputs.tree }}
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          BUILD_INDEX: ${{ matrix.index }}
        run: python .github/scripts/release-ci.py "$RELEASE_MODE" independent "$BUILD_INDEX"
      - uses: actions/upload-artifact@v4
        with:
          name: bex-rc-input-${{ needs.prepare.outputs.attempt }}-${{ matrix.index }}
          # Retrying one matrix job replaces only its slot in this source generation.
          overwrite: true
          path: ${{ runner.temp }}/bex-release-output/inputs.tar.gz
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bex-independent-log-${{ matrix.index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bex-release-output/*.log
          retention-days: 7
  final:
    needs: [prepare, independent]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JRELEASER_BRANCH: ${{ inputs.mode == 'rc' && 'next' || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT || github.token }}
          persist-credentials: ${{ inputs.mode != 'verify' }}
      - uses: ./.github/actions/release-setup
      - uses: actions/download-artifact@v4
        with:
          name: bex-release-source-${{ needs.prepare.outputs.attempt }}
          path: ${{ runner.temp }}/bex-release-source
      - uses: actions/download-artifact@v4
        with:
          pattern: bex-rc-input-${{ needs.prepare.outputs.attempt }}-*
          path: ${{ runner.temp }}/bex-release-downloads
      - name: Verify complete release graph without publication
        if: inputs.mode == 'verify'
        env:
          PREPARED_COMMIT: ${{ needs.prepare.outputs.commit }}
          PREPARED_TREE: ${{ needs.prepare.outputs.tree }}
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: python .github/scripts/release-ci.py verify join
      - name: Verify, sign and submit Maven Central deployment
        if: inputs.mode != 'verify'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          PREPARED_COMMIT: ${{ needs.prepare.outputs.commit }}
          PREPARED_TREE: ${{ needs.prepare.outputs.tree }}
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: python .github/scripts/release-ci.py "$RELEASE_MODE" join
      - name: Wait for Maven Central publication
        if: inputs.mode != 'verify'
        timeout-minutes: 35
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: >-
          python .github/scripts/wait-maven-central.py build/jreleaser/maven-central-submitted.properties
          --receipt "${{ runner.temp }}/bex-release-output/maven-publication.json"
      - name: Create release metadata after Maven Central publication
        if: inputs.mode != 'verify'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          PREPARED_COMMIT: ${{ needs.prepare.outputs.commit }}
          PREPARED_TREE: ${{ needs.prepare.outputs.tree }}
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
        run: python .github/scripts/release-ci.py "$RELEASE_MODE" metadata
      - name: Push successful RC commit and tag
        if: inputs.mode == 'rc'
        run: git push origin HEAD:next --follow-tags
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bex-release-evidence-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/bex-release-output/
            **/build/reports/**
            **/build/test-results/**
            **/build/libs/**
            build/distributions/**
            build/jreleaser/**
