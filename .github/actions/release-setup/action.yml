name: BEX Java 25 verification toolchain
description: One JDK for compilation, tests, Javadoc and release verification
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: corretto
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
