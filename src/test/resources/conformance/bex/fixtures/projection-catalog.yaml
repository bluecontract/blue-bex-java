- path: manifest.counterCoverage.complete
  definition: Bound package-manifest coverage projection.
- path: output.nodeBlueId
  definition: Blue output-admission result projection.
- path: output.boundaryValue
  definition: Independently serialized transient value presented to Language admission.
- path: output.boundaryValue.nullMember
  definition: Null-bearing member is absent from the value presented to Language admission.
- path: output.boundaryValue.emptyObjectMember
  definition: Exact empty-object member presented to Language admission.
- path: output.canonical
  definition: Independently serialized canonical value returned by Language admission.
- path: output.semantic
  definition: Exact admitted Blue semantic value after boundary normalization.
- path: output.itemBlueIds
  definition: Ordered direct identities of the admitted canonical Blue list children.
- path: output.reconstructed
  definition: Blue output-admission result projection.
- path: output.type.blueId
  definition: Blue output-admission result projection.
- path: parentBudgetAfter
  definition: Parent remaining budget after one exact child-ledger merge.
- path: result
  definition: Exact BEX semantic result before or after the declared Blue output boundary, as specified by the fixture.
- path: result.identityA
  definition: Closed BEX conformance projection.
- path: result.semantic
  definition: Closed BEX conformance projection.
- path: runtime.bufferedEffectsCommitted
  definition: Whether buffered BEX changes/events crossed the successful result boundary.
- path: runtime.overlayValue
  definition: Post-run accumulator overlay root, including the reset value after failure.
- path: runtime.started
  definition: Whether runtime execution began after compilation.
